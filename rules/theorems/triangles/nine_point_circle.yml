nine_point_circle_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(Circle(A, B, C))
  conclude:
    - midpoint(A, B) in nine_points_circle(A, B, C)
    - midpoint(B, C) in nine_points_circle(A, B, C)
    - midpoint(C, A) in nine_points_circle(A, B, C)
    - midpoint(A, orthocenter(A, B, C)) in nine_points_circle(A, B, C)
    - midpoint(B, orthocenter(A, B, C)) in nine_points_circle(A, B, C)
    - midpoint(C, orthocenter(A, B, C)) in nine_points_circle(A, B, C)
    - projection(A, Line(B, C)) in nine_points_circle(A, B, C)
    - projection(B, Line(A, C)) in nine_points_circle(A, B, C)
    - projection(C, Line(A, B)) in nine_points_circle(A, B, C)