between_imply_not_between:
  inputs:
    - A, B, C: Point
  where:
    - between(A, B, C)
  where_embedding:
    - A != B
  conclude:
    - collinear_and_not_between(B, A, C)
  rank: 2
  metadata: auto

between_implies_angles:
  inputs:
    - A, B, C: Point
  where:
    - between(A, B, C)
  conclude:
    - angle(A, B, C) == 180 mod 360
    - angle(B, C, A) == 0 mod 360
    - angle(C, A, B) == 0 mod 360

probably_between_and_collinear_implies_between:
  inputs:
    - A, B, C: Point
  where:
    - collinear(A, B, C)
    - probably_between(A, B, C)
  conclude:
    - between(A, B, C)

internal_angle_bisector_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(internal_angle_bisector(A, B, C))
  conclude:
    - B in internal_angle_bisector(A, B, C)

external_angle_bisector: #bisector trough the point B
  inputs:
    - A, B, C: Point
  where:
    - exists(external_angle_bisector(A, B, C))
  conclude:
    - B in external_angle_bisector(A, B, C)