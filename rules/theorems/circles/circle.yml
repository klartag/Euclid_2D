circle_definition:
  inputs:
    - A, B, C: Point
    - c: Circle
  where:
    - A, B, C in c
  where_embedding:
    - distinct(A, B, C)
  conclude:
    - c == Circle(A, B, C)
  rank: 5

circumcircle_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(Circle(A, B, C))
  conclude:
    - A, B, C in Circle(A, B, C)



