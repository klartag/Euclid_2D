circle_circle_tangent_point_definition:
  inputs:
    - c, d: Circle
  where:
    - exists(circle_circle_tangent_point(c, d))
  conclude:
    - circle_circle_tangent_point(c, d) in c, d

circle_circle_other_intersection_definition:
  inputs:
    - P: Point
    - c, d: Circle
  where:
    - exists(circle_circle_other_intersection(P, c, d))
  conclude:
    - circle_circle_other_intersection(P, c, d) in c, d

circle_tangency_unique_intersection:
  inputs:
    - A, B: Point
    - e, f: Circle
  where:
    - A, B in e, f
    - tangent(e, f)
  conclude:
    - A == B

