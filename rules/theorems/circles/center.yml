circle_radius:
  inputs:
    - A: Point
    - c: Circle
  where:
    - exists(center(c))
    - eq_radius: distance(center(c), A) == radius(c)
    - in_circle: A in c
  possible_conclusions:
    - eq_radius <=> in_circle
  rank: 3

circle_radius_auto:
  inputs:
    - A: Point
    - c: Circle
  where:
    - A in c
    - exists(Line(A, center(c)))
  conclude:
    - distance(A, center(c)) == radius(c)
  metadata: auto

circle_by_three_points_and_center:
  inputs:
    - O, A, B, C: Point
  where:
    - identical(distance(O, A), distance(O, B), distance(O, C))
  where_embedding:
    - distinct(A, B, C)
  conclude:
    - O == center(Circle(A, B, C))
  rank: 3

circumcenter_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(circumcenter(A, B, C)(
  conclude:
    - circumcenter(A, B, C) == center(Circle(A, B, C))

excenter_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(excenter(A, B, C))
  conclude:
    - excenter(A, B, C) in external_angle_bisector(A, C, B), external_angle_bisector(A, B, C), internal_angle_bisector(B, A, C)
    - excenter(A, B, C) == line_intersection(external_angle_bisector(A, C, B), external_angle_bisector(A, B, C))

incenter_definition:
  inputs:
    - A, B, C: Point
  where:
    - exists(incenter(A, B, C))
  conclude:
    - incenter(A, B, C) in internal_angle_bisector(A, B, C), internal_angle_bisector(A, C, B), internal_angle_bisector(C, A, B)
    - incenter(A, B, C) == line_intersection(internal_angle_bisector(A, B, C), internal_angle_bisector(A, C, B))