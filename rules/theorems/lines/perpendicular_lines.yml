perpendicular_direction_conditions:
  inputs:
    - A, B, C, D: Point
  where:
    - twice_angle_is_180: 2 * direction(A, B) - 2 * direction(C, D) == 180 mod 360
    - lines_are_perpendicular: perpendicular(Line(A, B), Line(C, D))
  possible_conclusions:
    - twice_angle_is_180 <=> lines_are_perpendicular
  rank: 2

perpendicular_angle_conditions:
  inputs:
    - A, B, C: Point
  possible_conclusions:
    - perpendicular(Line(A, B), Line(B, C)) <=> angle(A, B, C) == orientation(A, B, C) mod 360

perpendicular_line_definition:
  inputs:
    - A: Point
    - k, l: Line
  where:
    - A in k
    - perpendicular(k, l)
  conclude:
    - k == perpendicular_line(A, l)
  rank: 5

double_perpendicular_and_parallel:
  inputs:
    - k, l, m: Line
  where:
    - perpendicular(k, l)
  possible_conclusions:
    - perpendicular(l, m) <=> parallel(k, m)
  trivial_if_equal:
    - [k, m]

altitude_definition:
  inputs:
    - A, B, C: Point
    - l: Line
  where:
    - A in l
    - perpendicular(l, Line(B, C))
  where_embedding:
    - not_collinear(A, B, C)
  conclude:
    - l == altitude(A, B, C)

projection_definition:
  inputs:
    - A, A': Point
    - l: Line
  where:
    - A' in l
    - perpendicular(Line(A, A'), l)
  conclude:
    - A' == projection(A, l)
  rank: 5

projection_of_point_definition:
  inputs:
    - P: Point
    - l: Line
  where:
    - exists(projection(P, l))
  conclude:
  #sufficient
    - projection(P, l) == line_intersection(perpendicular_line(P, l), l)
  possible_conclusions:
    - P not in l => perpendicular_line(P, l) == Line(P, projection(P, l))
    - P in l => P == projection(P, l)

altitude_is_perpendicular:
  inputs:
    - A, B, C: Point
  where:
    - exists(altitude(A, B, C))
  conclude:
  #sufficient
    - altitude(A, B, C) == perpendicular_line(A, Line(B, C))