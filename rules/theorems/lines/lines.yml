line_definition:
  inputs:
    - A, B: Point
    - l: Line
  where:
    - A in l
    - B in l
  where_embedding:
    - A != B
  conclude:
    - l == Line(A, B)
  rank: 5

points_on_line:
  inputs:
    - A, B: Point
  where:
    - exists(Line(A, B))
  conclude:
    - A, B in Line(A, B)

line_intersection_is_on_lines:
  inputs:
    - l, m: Line
  where:
    - exists(line_intersection(l, m))
  conclude:
    - line_intersection(l, m) in l, m

line_uniqueness:
  inputs:
    - A, B: Point
    - l1, l2: Line
  where:
    - A, B in l1
    - A, B in l2
  where_embedding:
    - A != B
  conclude:
    - l1 == l2
  rank: 3
  trivial_if_equal:
    - [l1, l2]

line_intersection_definition:
  inputs:
    - A: Point
    - k, l: Line
  where:
    - A in k, l
  where_embedding:
    - k != l
  conclude:
    - A == line_intersection(k, l)
  rank: 5

line_unique_intersection:
  inputs:
    - l, m: Line
    - P, Q: Point
  where:
    - P, Q in m
    - P, Q in l
  where_embedding:
    - l != m
  conclude:
    - P == Q
  rank: 3

concurrent_sufficient_conditions:
  inputs:
    - k, l, m: Line
  where:
    - line_intersection(k, m) == line_intersection(m, l)
  where_embedding:
    - distinct(k, l, m)
  conclude:
    - concurrent(k, m, l)
  rank: 5

parallel_line_definition:
  inputs:
    - A: Point
    - l: Line
  where:
    - exists(parallel_line(A, l))
  conclude:
    - A in parallel_line(A, l)
    - parallel(l, parallel_line(A, l))

perpendicular_line_definition:
  inputs:
    - A: Point
    - l: Line
  where:
    - exists(perpendicular_line(A, l))
  conclude:
    - A in perpendicular_line(A, l)
    - perpendicular(l, perpendicular_line(A, l))