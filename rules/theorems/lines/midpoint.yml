midpoint_definition:
  inputs:
    - A, B, C: Point
  where:
    - distance(A, C) == distance(B, C)
  possible_conclusions:
    - C in Line(A, B) => C == midpoint(A, B)
    - between(A, C, B) => C == midpoint(A, B)
  rank: 5
  trivial_if_equal:
    - [A, B]

median_definition: #line from point A to the midpoint of the segment BC
  inputs:
    - A, B, C: Point
  where:
    - exists(median(A, B, C))
  conclude:
    - median(A, B, C) == Line(A, midpoint(B, C))